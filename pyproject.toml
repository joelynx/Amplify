[project]
name = "amplify"
version = "0.1.0"
description = "Desktop question-set generator and practice tool. Single user, offline, LaTeX-rendered PDFs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Joel Jobi" }]

dependencies = [
    "pywebview>=5.3",
    "openpyxl>=3.1",
    "numpy>=2.1",
    "pydantic>=2.9",
    "lancedb>=0.30.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
amplify = "app.main:main"
amplify-ingest = "app.tools.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
